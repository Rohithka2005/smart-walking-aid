<svg xmlns="http://www.w3.org/2000/svg" width="940" height="510" viewBox="0 0 940 510"><rect width="100%" height="100%" fill="#f8fafc"/><style>.t{font:700 24px Arial;fill:#0f172a}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:12}.p{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:12}.h{font:700 16px Arial;text-anchor:middle;fill:#0f172a}.s{font:13px Arial;text-anchor:middle;fill:#334155}.a{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#475569"/></marker></defs><text x="35" y="42" class="t">Smart Walking Aid — System Architecture</text><rect x="45" y="105" width="220" height="75" class="b"/><text x="155" y="135" class="h">Left/Right IR</text><text x="155" y="157" class="s">GPIO 34 / 35</text><rect x="45" y="215" width="220" height="75" class="b"/><text x="155" y="245" class="h">Ultrasonic Sensor</text><text x="155" y="267" class="s">TRIG 5 / ECHO 18</text><rect x="45" y="325" width="220" height="75" class="b"/><text x="155" y="355" class="h">ADXL345</text><text x="155" y="377" class="s">I2C 21 / 22</text><rect x="350" y="200" width="240" height="100" class="b"/><text x="470" y="239" class="h">ESP32</text><text x="470" y="263" class="s">Sensor logic + HTTP server</text><text x="470" y="283" class="s">Local Wi-Fi access point</text><path d="M265 143 L310 143 L310 222 L350 222" class="a"/><path d="M265 253 L350 253" class="a"/><path d="M265 363 L310 363 L310 278 L350 278" class="a"/><rect x="675" y="105" width="220" height="75" class="o"/><text x="785" y="135" class="h">16x2 LCD</text><text x="785" y="157" class="s">Distance + state</text><rect x="675" y="215" width="220" height="75" class="o"/><text x="785" y="245" class="h">LED</text><text x="785" y="267" class="s">Visual alert on GPIO 2</text><path d="M590 225 L630 225 L630 142 L675 142" class="a"/><path d="M590 272 L630 272 L630 252 L675 252" class="a"/><rect x="350" y="365" width="240" height="75" class="p"/><text x="470" y="395" class="h">Phone App</text><text x="470" y="417" class="s">Polls /fall every 5 s</text><path d="M470 300 L470 365" class="a"/><text x="470" y="472" class="s">Phone workflow provides location/SMS; no GPS receiver is shown on ESP32.</text></svg>