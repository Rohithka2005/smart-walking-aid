<svg xmlns="http://www.w3.org/2000/svg" width="860" height="690" viewBox="0 0 860 690"><rect width="100%" height="100%" fill="#f8fafc"/><style>.t{font:700 24px Arial;fill:#0f172a}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:12}.p{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:12}.h{font:700 16px Arial;text-anchor:middle;fill:#0f172a}.s{font:13px Arial;text-anchor:middle;fill:#334155}.a{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#475569"/></marker></defs><text x="35" y="42" class="t">Prototype Control Flow</text><rect x="250" y="85" width="360" height="55" class="b"/><text x="430" y="118" class="h">Initialize ESP32, LCD, I2C and sensors</text><path d="M430 140 L430 170" class="a"/><rect x="250" y="170" width="360" height="70" class="b"/><text x="430" y="197" class="h">Read IR, ultrasonic and ADXL345</text><text x="430" y="220" class="s">Calculate acceleration magnitude</text><path d="M430 240 L430 270" class="a"/><polygon points="430,270 575,330 430,390 285,330" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="430" y="325" class="h">Magnitude &lt; 9?</text><text x="430" y="346" class="s">Unvalidated fall heuristic</text><path d="M285 330 L145 330 L145 410" class="a"/><text x="210" y="315" class="s">Yes</text><rect x="35" y="410" width="220" height="65" class="o"/><text x="145" y="437" class="h">Set FALL flag</text><text x="145" y="459" class="s">LCD alert + LED ON</text><path d="M575 330 L715 330 L715 410" class="a"/><text x="650" y="315" class="s">No</text><rect x="605" y="410" width="220" height="65" class="o"/><text x="715" y="437" class="h">Check obstacles</text><text x="715" y="459" class="s">Left → right → front → clear</text><path d="M145 475 L145 510 L430 510 L430 545" class="a"/><path d="M715 475 L715 510 L430 510" class="a"/><rect x="250" y="545" width="360" height="60" class="p"/><text x="430" y="570" class="h">HTTP GET /fall → FALL or SAFE</text><text x="430" y="590" class="s">Phone polls every 5 seconds; described app sends SMS on FALL</text><text x="430" y="644" class="s">Thresholds are prototype values and require validation before real-world use.</text></svg>