xt x="785" y="205">LCD E</text><text x="785" y="223" class="s">GPIO 12</text><text x="785" y="270">LCD D4</text><text x="785" y="288" class="s">GPIO 13</text><text x="785" y="335">LCD D5</text><text x="785" y="353" class="s">GPIO 4</text><text x="785" y="400">LCD D6</text><text x="785" y="418" class="s">GPIO 25</text><text x="785" y="465">LCD D7</text><text x="785" y="483" class="s">GPIO 26</text><text x="785" y="530">ADXL345 SCL</text><text x="785" y="548" class="s">GPIO 22</text></g><g class="a"><path d="M265 144 L340 200"/><path d="M265 229 L340 245"/><path d="M265 314 L340 300"/><path d="M265 399 L340 350"/><path d="M265 484 L340 440"/><path d="M600 190 L675 144"/><path d="M600 230 L675 209"/><path d="M600 270 L675 274"/><path d="M600 310 L675 339"/><path d="M600 350 L675 404"/><path d="M600 390 L675 469"/><path d="M600 430 L675 534"/></g><rect x="675" y="575" width="220" height="48" class="b"/><text x="785" y="595" class="h">LED alert</text><text x="785" y="613" class="s">GPIO 2</text><path d="M600 480 L675 599" class="a"/><text x="470" y="670" class="s">*If the ultrasonic ECHO output is 5 V, use an appropriate divider/level shifter before GPIO 18.</text><text x="470" y="695" class="s">Verify the selected ESP32 variant and each module's supply/logic levels.</text></svg>